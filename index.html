<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          if (currentFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Early fetch patch failed:', e);
        }
      })();
    </script>
